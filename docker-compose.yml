services:
  mongo:
    image: mongo:7
    container_name: devtrack-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - devtrack

  server:
    build:
      context: ./server
    container_name: devtrack-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/devtrack
      JWT_SECRET: ${JWT_SECRET:-change-me}
    depends_on:
      - mongo
    networks:
      - devtrack

  client:
    build:
      context: ./client
    container_name: devtrack-client
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - devtrack

  nginx:
    image: nginx:1.27-alpine
    container_name: devtrack-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - server
    networks:
      - devtrack

volumes:
  mongo_data:

networks:
  devtrack:
